# Override any key with -Dkey=value or an environment variable (BASE_URL, etc.).
base.url=https://restful-booker.herokuapp.com
# Public sandbox credentials only. Do not publish real credentials in reports.
auth.username=admin
auth.password=password123
http.connect.timeout.ms=15000
http.socket.timeout.ms=30000
# Only the read-only startup health check is retried. Test writes are never replayed.
warmup.max.attempts=4
warmup.backoff.ms=2000
# Optional: Windows-ROOT when the JDK does not trust the local network's TLS chain.
# Empty uses the JDK default. TLS verification remains enabled in either case.
ssl.truststore.type=